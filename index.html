<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ayam Geybok Bang Jarwo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <!-- logo -->
        <div class="logo">
            <img src="image/logo.jpg">
        </div>

        <nav>
            <!-- home -->
            <a href="#" class="nav-link active" onclick="openPage('home-page', this)">
                HOME
            </a>

            <!-- produk -->
            <a href="#" class="nav-link" onclick="openPage('produk-page', this)">
                PRODUK
            </a>

            <!-- dropdown informasi (produk unggulan, lokasi, pemesanan) -->
            <div class="dropdown">
                <!-- informasi -->
                <a href="#" class="nav-link" onclick="return false;">
                INFORMASI
                </a>

                <div class="dropdown-content">
                    <!-- produk unggulan -->
                    <a href="#" onclick="openPage('home-page', this); setTimeout(function(){
                        document.getElementById('unggulan').scrollIntoView(); }, 100);">
                        PRODUK UNGGULAN
                    </a>

                    <!-- lokasi -->
                    <a href="#" onclick="openPage('home-page', this); setTimeout(function(){
                        document.getElementById('lokasi').scrollIntoView(); }, 100);">
                        LOKASI
                    </a>

                    <!-- pemesanan -->
                    <a href="#" onclick="openPage('pemesanan-page', this)">
                        PEMESANAN
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <footer>
        <div class="footer-left">
            <img src="image/logo.jpg" alt="logo">
            <span>Ayam Geybok Bang Jarwo</span>
        </div>

        <div class="footer-social">
            <a href="https://facebook.com/ayamgeybokbangjarwo" target="_blank" class="social-item">
                <i class="fa-brands fa-facebook"></i>
                <span>@ayamgeybokbangjarwo</span>
            </a>
            <a href="https://instagram.com/ayamgeybokbangjarwo" target="_blank" class="social-item">
                <i class="fa-brands fa-instagram"></i>
                <span>@ayamgeybokbangjarwo</span>
            </a>
            <a href="https://tiktok.com/@ayamgeybokbangjarwo" target="_blank" class="social-item">
                <i class="fa-brands fa-tiktok"></i>
                <span>@ayamgeybokbangjarwo</span>
            </a>
        </div>
    </footer>

</body>
</html>
