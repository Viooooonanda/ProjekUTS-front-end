<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Pemesanan - Ayam Geybok Bang Jarwo</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="image/logo.jpg"
                alt="Logo UMKM">
        </div>

        <nav>

            <a href="index.html">
                HOME
            </a>
            <a href="index.html#produk">
                PRODUK
            </a>
            <div class="dropdown">

                <a href="#">
                    INFORMASI ▼
                </a>

                <div class="dropdown-content">
                    <a href="index.html#produk">
                        PRODUK UNGGULAN
                    </a>
                    <a href="index.html#lokasi">
                        LOKASI
                    </a>
                    <a href="pemesanan.html">
                        PEMESANAN
                    </a>
                </div>
            </div>
        </nav>
    </header>


    <!-- FORM PEMESANAN -->
    <section class="order">
        <div class="order-container">

            <h2>
                Pesan Menu
            </h2>
            <p>
                Isi data di bawah untuk melakukan pemesanan.
            </p>
            <form>
                <!-- NAMA -->
                <label for="nama">
                    Nama
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama">

                <!-- NOMOR HP -->
                <label for="nomor">
                    Nomor HP
                </label>
                <input
                    type="text"
                    id="nomor"
                    placeholder="08xxxxxxxxxx">

                <!-- PRODUK -->
                <label for="produk">
                    Pilihan Produk
                </label>

                <select id="produk">

                    <option>
                        Pilih menu
                    </option>

                    <option>
                        Paket Ayam Blonde
                    </option>

                    <option>
                        Paket Ayam Geybok
                    </option>

                    <option>
                        Paket Ayam Kriuk
                    </option>

                </select>

                <!-- JUMLAH -->
                <label for="jumlah">
                    Jumlah
                </label>

                <input
                    type="number"
                    id="jumlah"
                    value="1"
                    min="1">


                <!-- HARGA -->
                <label for="harga">
                    Harga
                </label>

                <input
                    type="text"
                    id="harga"
                    value="Rp 23.000"
                    readonly>


                <!-- CATATAN -->
                <label for="catatan">
                    Catatan
                </label>

                <textarea
                    id="catatan"
                    placeholder="Tambahkan catatan pesanan..."></textarea>


                <!-- PEMBAYARAN -->
                <label>
                    Metode Pembayaran
                </label>


                <div class="payment">

                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="QRIS">

                        QRIS

                    </label>
                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="Cash">

                        Cash

                    </label>
                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="Debit">

                        Debit

                    </label>

                </div>

                <!-- TOTAL -->
                <div class="total">

                    <span>
                        Total
                    </span>

                    <strong>
                        Rp 23.000
                    </strong>

                </div>


                <!-- SUBMIT -->
                <button
                    type="button"
                    onclick="alert('Pesanan berhasil dikirim!')">

                    SUBMIT

                </button>
                <small>

                    * Pastikan data pesanan sudah benar
                    sebelum menekan Submit.

                </small>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <h3>
                AYAM GEYBOK BANG JARWO
            </h3>
            <p>
                Kuliner ayam dengan cita rasa khas
                dan harga terjangkau.
            </p>
            <div class="social">
                <a href="#">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="#">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
        </div>
    </footer>
</div>

</body>
</html>
